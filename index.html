{id:23,cat:"art",brand:"CRAYOLA",ar:"أقلام شمعية للأطفال 24 لون",en:"Kids Wax Crayons, 24 Colours",price:19,old:23,img:"https://images.unsplash.com/photo-1596464716127-f2a82984de30?auto=format&fit=crop&w=600&q=80",keys:"crayon children ألوان"},
{id:24,cat:"art",brand:"MAPED",ar:"طقم أشغال يدوية للأطفال",en:"Creative Craft Kit For Kids",price:39,old:48,img:"https://images.unsplash.com/photo-1598880940080-ff9a29891b85?auto=format&fit=crop&w=600&q=80",keys:"craft educational أطفال"},
{id:25,cat:"bags",brand:"JANSPORT",ar:"حقيبة مدرسية كلاسيكية مبطنة",en:"Classic Padded School Backpack",price:115,old:139,img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=80",keys:"bag backpack حقيبة"},
{id:26,cat:"bags",brand:"SKYBAGS",ar:"حقيبة مدرسية بعجلات للأطفال",en:"Kids Trolley School Bag",price:145,old:175,img:"https://images.unsplash.com/photo-1581605405669-fcdf81165afa?auto=format&fit=crop&w=600&q=80",keys:"bag trolley حقيبة"},
{id:27,cat:"bags",brand:"MAPED",ar:"مقلمة مدرسية مزدوجة",en:"Double Compartment Pencil Case",price:22,old:28,img:"https://images.unsplash.com/photo-1606248897732-2c5ffe759c04?auto=format&fit=crop&w=600&q=80",keys:"case مقلمة"},
{id:28,cat:"bags",brand:"MILAN",ar:"مقلمة مجهزة بـ 30 قطعة",en:"Filled Pencil Case, 30 Pieces",price:58,old:69,img:"https://images.unsplash.com/photo-1560785496-3c9d27877182?auto=format&fit=crop&w=600&q=80",keys:"case مقلمة school"},
{id:29,cat:"bags",brand:"LOCK&LOCK",ar:"حافظة طعام مدرسية محكمة",en:"Sealed School Lunch Box",price:36,old:43,img:"https://images.unsplash.com/photo-1602532305019-3dbbd482dae9?auto=format&fit=crop&w=600&q=80",keys:"lunch box طعام"},
{id:30,cat:"bags",brand:"CONTIGO",ar:"قارورة مياه مدرسية 500 مل",en:"School Water Bottle, 500ml",price:39,old:47,img:"https://images.unsplash.com/photo-1602143407151-7111542de6e8?auto=format&fit=crop&w=600&q=80",keys:"bottle water قارورة"}
];
let lang=localStorage.getItem("manhajLang")||"ar",cart=JSON.parse(localStorage.getItem("manhajCart")||"[]"),wishlist=new Set(JSON.parse(localStorage.getItem("manhajWish")||"[]")),slide=0,timer;

const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
function money(n){return `${Number(n).toLocaleString(lang==="ar"?"ar-LY":"en-US",{maximumFractionDigits:2})} ${lang==="ar"?"د.ل":"LYD"}`}
function applyLanguage(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 $$("[data-ar]").forEach(el=>{let v=el.dataset[lang];if(v!==undefined)el.textContent=v});
 $$("[data-ph-ar]").forEach(el=>el.placeholder=el.dataset[lang==="ar"?"phAr":"phEn"]);
 $$(".money").forEach(el=>el.textContent=money(el.dataset.price));
 $$(".language-label").forEach(el=>el.textContent=lang==="ar"?"English":"العربية");
 renderAll();renderCart();
}
function card(p){
 let off=Math.round((1-p.price/p.old)*100);
 return `<article class="product">
 <span class="discount">-${off}%</span><span class="stock">${lang==="ar"?"متوفر":"IN STOCK"}</span>
 <button class="fav ${wishlist.has(p.id)?"active":""}" data-fav="${p.id}"><i class="${wishlist.has(p.id)?"fa-solid":"fa-regular"} fa-heart"></i></button>
 <div class="product-image"><img loading="lazy" src="${p.img}" alt="${lang==="ar"?p.ar:p.en}"><button class="quick" data-quick="${p.id}">${lang==="ar"?"عرض سريع":"QUICK VIEW"}</button></div>
 <div class="product-info"><span class="brand">${p.brand}</span><div class="product-title">${lang==="ar"?p.ar:p.en}</div>
 <div class="rating">★★★★★ <span>(4.8)</span></div><div class="price-row"><span class="price">${money(p.price)}</span><span class="old">${money(p.old)}</span></div>
 <div class="card-actions"><button class="add" data-add="${p.id}"><i class="fa-solid fa-cart-plus"></i> ${lang==="ar"?"أضف للسلة":"ADD TO CART"}</button><button class="compare"><i class="fa-solid fa-code-compare"></i></button></div></div></article>`;
}
function renderAll(){
 const sets={schoolProducts:"school",paperProducts:"paper",officeProducts:"office",artProducts:"art",bagProducts:"bags"};
 Object.entries(sets).forEach(([id,cat])=>$("#"+id).innerHTML=products.filter(p=>p.cat===cat).map(card).join(""));
 $("#dealProducts").innerHTML=products.filter(p=>p.old-p.price>=5).slice(0,10).map(card).join("");
}
function save(){localStorage.setItem("manhajCart",JSON.stringify(cart));localStorage.setItem("manhajWish",JSON.stringify([...wishlist]))}
function addCart(id){
 let item=cart.find(x=>x.id===id);if(item)item.qty++;else cart.push({id,qty:1});save();renderCart();toast(lang==="ar"?"تمت إضافة المنتج إلى السلة":"Product added to cart");
}
function renderCart(){
 $("#cartCount").textContent=cart.reduce((a,b)=>a+b.qty,0);$("#wishCount").textContent=wishlist.size;
 if(!cart.length)$("#cartItems").innerHTML=`<div class="empty"><div><i class="fa-solid fa-cart-shopping"></i><strong>${lang==="ar"?"سلتك فارغة":"Your cart is empty"}</strong><p>${lang==="ar"?"ابدأ بإضافة لوازمك المفضلة":"Start adding your favourite supplies"}</p></div></div>`;
 else $("#cartItems").innerHTML=cart.map(x=>{let p=products.find(y=>y.id===x.id);return `<div class="cart-item"><img src="${p.img}" alt=""><div><h4>${lang==="ar"?p.ar:p.en}</h4><strong>${money(p.price)}</strong><div class="qty"><button data-qty="${p.id}" data-change="-1">−</button><span>${x.qty}</span><button data-qty="${p.id}" data-change="1">+</button></div></div><button class="remove" data-remove="${p.id}"><i class="fa-solid fa-trash"></i></button></div>`}).join("");
 let total=cart.reduce((s,x)=>s+products.find(p=>p.id===x.id).price*x.qty,0);$("#cartTotal").textContent=money(total);
}
function toggleCart(open=true){$("#cart").classList.toggle("open",open);$("#overlay").classList.toggle("active",open)}
function toast(msg){let t=document.createElement("div");t.className="toast";t.innerHTML=`<i class="fa-solid fa-circle-check"></i> ${msg}`;$("#toasts").append(t);setTimeout(()=>t.remove(),2800)}
function showModal(title,body){$("#modalTitle").textContent=title;$("#modalBody").innerHTML=body;$("#modalLayer").classList.add("active")}
function quickView(id){let p=products.find(x=>x.id===id);showModal(lang==="ar"?"تفاصيل المنتج":"Product Details",`<div class="quick-grid"><div class="quick-image"><img src="${p.img}" alt=""></div><div class="quick-details"><span class="brand">${p.brand}</span><h3>${lang==="ar"?p.ar:p.en}</h3><div class="rating">★★★★★ <span>(4.8)</span></div><span class="price">${money(p.price)}</span><p>${lang==="ar"?"منتج أصلي عالي الجودة، مناسب للاستخدام المدرسي والمكتبي اليومي. متوفر الآن مع خدمة التوصيل داخل طرابلس.":"A genuine, high-quality product ideal for everyday school and office use. Available now with delivery across Tripoli."}</p><button class="btn" data-add="${p.id}"><i class="fa-solid fa-cart-plus"></i>${lang==="ar"?"أضف للسلة":"Add To Cart"}</button></div></div>`)}
function search(q="",cat=""){
 q=q.trim().toLowerCase();return products.filter(p=>(!cat||p.cat===cat)&&(!q||`${p.ar} ${p.en} ${p.brand} ${p.keys}`.toLowerCase().includes(q)));
}
function showResults(q,cat=""){
 let found=search(q,cat);showModal(lang==="ar"?"نتائج البحث":"Search Results",`<div class="results">${found.length?found.map(p=>`<article class="result"><img src="${p.img}" alt=""><div><h4>${lang==="ar"?p.ar:p.en}</h4><strong>${money(p.price)}</strong><button data-add="${p.id}">${lang==="ar"?"أضف للسلة":"ADD TO CART"}</button></div></article>`).join(""):`<div class="empty"><div><i class="fa-solid fa-magnifying-glass"></i>${lang==="ar"?"لا توجد نتائج مطابقة":"No matching results"}</div></div>`}</div>`)}
function goSlide(n){slide=(n+3)%3;$$(".slide").forEach((x,i)=>x.classList.toggle("active",i===slide));$$(".dot").forEach((x,i)=>x.classList.toggle("active",i===slide))}
function restartSlider(){clearInterval(timer);timer=setInterval(()=>goSlide(slide+1),6000)}
function openCategory(cat){showResults("",cat);$("#drawer").classList.remove("open");$("#overlay").classList.remove("active")}

document.addEventListener("click",e=>{
 let b=e.target.closest("button,a");if(!b)return;
 if(b.matches("[data-add]"))addCart(+b.dataset.add);
 if(b.matches("[data-quick]"))quickView(+b.dataset.quick);
 if(b.matches("[data-fav]")){let id=+b.dataset.fav;wishlist.has(id)?wishlist.delete(id):wishlist.add(id);save();renderAll();renderCart();toast(lang==="ar"?"تم تحديث المفضلة":"Wishlist updated")}
 if(b.matches("[data-category]"))openCategory(b.dataset.category);
 if(b.matches("[data-query]"))showResults(b.dataset.query);
 if(b.matches("[data-track]"))$("#"+b.dataset.track).scrollBy({left:+b.dataset.dir*450,behavior:"smooth"});
 if(b.matches("[data-remove]")){cart=cart.filter(x=>x.id!==+b.dataset.remove);save();renderCart()}
 if(b.matches("[data-qty]")){let x=cart.find(i=>i.id===+b.dataset.qty);x.qty+=+b.dataset.change;if(x.qty<1)cart=cart.filter(i=>i.id!==x.id);save();renderCart()}
 if(b.matches(".compare")){b.classList.toggle("active");toast(lang==="ar"?"تم تحديث قائمة المقارنة":"Comparison list updated")}
 if(b.matches("[data-map]"))window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(b.dataset.map),"_blank");
});
$$(".language").forEach(b=>b.onclick=()=>{lang=lang==="ar"?"en":"ar";localStorage.setItem("manhajLang",lang);applyLanguage()});
$("#departments").onclick=()=>$("#mega").classList.toggle("active");
$("#menuBtn").onclick=()=>{$("#drawer").classList.add("open");$("#overlay").classList.add("active")};
$("#closeDrawer").onclick=()=>{$("#drawer").classList.remove("open");$("#overlay").classList.remove("active")};
$("#cartBtn").onclick=()=>toggleCart(true);$("#closeCart").onclick=()=>toggleCart(false);
$("#overlay").onclick=()=>{toggleCart(false);$("#drawer").classList.remove("open");$("#mega").classList.remove("active")};
$("#closeModal").onclick=()=>$("#modalLayer").classList.remove("active");
$("#modalLayer").onclick=e=>{if(e.target===$("#modalLayer"))$("#modalLayer").classList.remove("active")};
$("#nextSlide").onclick=()=>{goSlide(slide+1);restartSlider()};$("#prevSlide").onclick=()=>{goSlide(slide-1);restartSlider()};
$$(".dot").forEach(d=>d.onclick=()=>{goSlide(+d.dataset.slide);restartSlider()});
$("#searchInput").addEventListener("input",e=>{
 let q=e.target.value,found=search(q,$("#searchCategory").value).slice(0,5);
 $("#suggestions").classList.toggle("active",q.length>0);
 $("#suggestions").innerHTML=found.map(p=>`<button class="suggestion" data-quick="${p.id}"><img src="${p.img}"><span>${lang==="ar"?p.ar:p.en}</span><b>${money(p.price)}</b></button>`).join("");
});
$("#searchForm").onsubmit=e=>{e.preventDefault();$("#suggestions").classList.remove("active");showResults($("#searchInput").value,$("#searchCategory").value)};
$("#accountBtn").onclick=()=>showModal(lang==="ar"?"تسجيل الدخول":"Account Login",`<form class="form-grid" onsubmit="event.preventDefault();toast('${lang==="ar"?"تم تسجيل الدخول بنجاح":"Signed in successfully"}');document.querySelector('#modalLayer').classList.remove('active')"><div class="field full"><label>${lang==="ar"?"البريد الإلكتروني أو رقم الهاتف":"Email or phone number"}</label><input required></div><div class="field full"><label>${lang==="ar"?"كلمة المرور":"Password"}</label><input type="password" required></div><div class="field full"><button class="submit">${lang==="ar"?"تسجيل الدخول":"SIGN IN"}</button></div></form>`);
$("#wishBtn").onclick=()=>showResults([...wishlist].map(id=>products.find(p=>p.id===id)?.brand).join("|"));
$("#trackBtn").onclick=()=>showModal(lang==="ar"?"تتبع طلبك":"Track Your Order",`<form class="form-grid" onsubmit="event.preventDefault();toast('${lang==="ar"?"جاري البحث عن الطلب":"Searching for your order"}')"><div class="field full"><label>${lang==="ar"?"رقم الطلب":"Order number"}</label><input required placeholder="AM-0000"></div><div class="field full"><button class="submit">${lang==="ar"?"تتبع الطلب":"TRACK ORDER"}</button></div></form>`);
$("#quoteBtn").onclick=()=>window.open("https://wa.me/218912345678?text="+encodeURIComponent(lang==="ar"?"مرحباً، أريد طلب عرض سعر للقرطاسية":"Hello, I would like a stationery quotation"),"_blank");
$("#checkoutBtn").onclick=()=>{
 if(!cart.length)return toast(lang==="ar"?"السلة فارغة":"Your cart is empty");
 toggleCart(false);showModal(lang==="ar"?"إتمام الطلب":"Checkout",`<form class="form-grid" id="checkoutForm"><div class="field"><label>${lang==="ar"?"الاسم الكامل":"Full name"}</label><input required></div><div class="field"><label>${lang==="ar"?"رقم الهاتف":"Phone number"}</label><input required></div><div class="field full"><label>${lang==="ar"?"عنوان التوصيل":"Delivery address"}</label><input required></div><div class="field"><label>${lang==="ar"?"المدينة":"City"}</label><input value="${lang==="ar"?"طرابلس":"Tripoli"}"></div><div class="field"><label>${lang==="ar"?"طريقة الدفع":"Payment method"}</label><select><option>${lang==="ar"?"الدفع عند الاستلام":"Cash on delivery"}</option><option>${lang==="ar"?"بطاقة مصرفية":"Bank card"}</option></select></div><div class="field full"><button class="submit">${lang==="ar"?"تأكيد الطلب":"CONFIRM ORDER"}</button></div></form>`);
 setTimeout(()=>{$("#checkoutForm").onsubmit=e=>{e.preventDefault();cart=[];save();renderCart();$("#modalBody").innerHTML=`<div class="empty"><div><i class="fa-solid fa-circle-check" style="color:#22a85a"></i><h2>${lang==="ar"?"تم استلام طلبك بنجاح":"Order received successfully"}</h2><p>${lang==="ar"?"سنتواصل معك قريباً لتأكيد التوصيل.":"We will contact you shortly to confirm delivery."}</p></div></div>`}},0);
};
$("#newsletter").onsubmit=e=>{e.preventDefault();toast(lang==="ar"?"شكراً لاشتراكك في عروضنا":"Thank you for subscribing");e.target.reset()};
window.addEventListener("scroll",()=>$("#backTop").classList.toggle("show",scrollY>600));
$("#backTop").onclick=()=>scrollTo({top:0,behavior:"smooth"});
setInterval(()=>{let now=new Date(),end=new Date();end.setHours(23,59,59);let s=Math.max(0,Math.floor((end-now)/1000)),h=String(Math.floor(s/3600)).padStart(2,"0"),m=String(Math.floor(s%3600/60)).padStart(2,"0"),sec=String(s%60).padStart(2,"0");$("#countdown").innerHTML=`<b>${h}</b><b>${m}</b><b>${sec}</b>`},1000);
applyLanguage();restartSlider();
</script>
</body>
</html>
